name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: VITE_APP_BUILD=${{ github.run_number }} npm run build

      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Wait for uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for AegisAttempt in $(seq 1 15); do
            AegisArtifactCount=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$AegisArtifactCount" = 1 ]; then
              echo "Pages artifact metadata verified"
              exit 0
            fi
            if [ "$AegisArtifactCount" -gt 1 ]; then
              echo "AEGIS_STOP: MULTIPLE_PAGES_ARTIFACTS"
              exit 1
            fi
            sleep 2
          done
          echo "AEGIS_STOP: PAGES_ARTIFACT_METADATA_DEADLINE"
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
